<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Reflektionskort</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #F7F5F2;
      transition: background-color 0.5s ease;
    }

    .card {
      max-width: 700px;
      width: 90%;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      font-size: 1.4em;
      background-color: white;
      transition: all 0.4s ease;
    }

    #question {
      white-space: pre-line;
    }

    .btn {
      margin-top: 40px;
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 30px;
      background-color: #5C6BC0;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #3f51b5;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div id="question">Reflektion</div>
    <button class="btn" onclick="nextCard()">Visa dagens reflektion</button>
  </div>

  <script>
    const cards = [
      {
        text: "Vad brukar utmana mitt tålamod på jobbet – och hur hanterar jag det på ett medvetet sätt?",
        bgColor: "#FFF4E5"
      },
      {
        text: "När upplever jag mest arbetsglädje – och vad i situationen bidrar till det?",
        bgColor: "#E3F2FD"
      },
      {
        text: "Vilka tre saker ger mig mest energi i arbetslivet just nu?",
        bgColor: "#E8F5E9"
      }
    ];

    let currentIndex = 0;

    function nextCard() {
      if (currentIndex >= cards.length) {
        currentIndex = 0; // eller stäng knappen om du vill stoppa efter sista kortet
      }

      const card = cards[currentIndex];
      document.getElementById("question").innerText = card.text;
      document.body.style.backgroundColor = card.bgColor;
      currentIndex++;
    }
  </script>
</body>
</html>
