<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Dagens reflektion</title>
  <style>
    body {
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Helvetica Neue', sans-serif;
      margin: 0;
    }
    #card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      max-width: 600px;
      text-align: center;
      font-size: 1.3em;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="card">Laddar dagens reflektion...</div>

  <script>
    const cards = [
      "Vad brukar utmana mitt tålamod på jobbet – och hur hanterar jag det på ett medvetet sätt?",
      "När upplever jag mest arbetsglädje – och vad i situationen bidrar till det?",

      "När på dagen är min energi som bäst – och hur använder jag det?",

    const card = cards[Math.floor(Math.random() * cards.length)];
    document.getElementById("card").innerText = card;
  </script>
</body>
</html>
