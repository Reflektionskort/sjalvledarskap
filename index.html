
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Dagens Reflektion</title>
  <style>

<body>
  <img src="slavledarskap/logotyp.png" class="logo" alt="Medborgarskolan logotyp" />
  <div class="card" id="card">

    <button class="btn" onclick="nextCard()">Visa nästa kort</button>
  </div>

l lösning?", "bg": "#D85F4E", "textColor": "#FFFFFF"}, {"text": "Vilka vanor eller rutiner stärker min balans mellan arbete och fritid?", "bg": "#EAD5EA", "textColor": "#211b83"}, {"text": "När på dagen är min energi som bäst – och hur använder jag det?", "bg": "#D85F4E", "textColor": "#FFFFFF"}, {"text": "Vilken energi sprider jag i min omgivning – och vilken energi vill jag sprida?", "bg": "#FFD3CF", "textColor": "#211b83"}, {"text": "Vilka signaler visar att jag är på väg att bli stressad – och hur kan jag lyssna på dem?", "bg": "#D5A249", "textColor": "#211b83"}, {"text": "Vad i arbetsmiljön tenderar att stressa mig – och hur kan jag agera proaktivt?", "bg": "#DCECEF", "textColor": "#211b83"}, {"text": "Hur firar jag mina egna framgångar – små som stora?", "bg": "#50A597", "textColor": "#211b83"}, {"text": "Hur visar jag mig själv vänlighet och självmedkänsla när något är svårt?", "bg": "#976F2B", "textColor": "#FFFFFF"}, {"text": "Vad innebär det för mig att vara snäll mot mig själv – på riktigt?", "bg": "#50A597", "textColor": "#211b83"}, {"text": "Hur visar vi omsorg om varandra i vår arbetsgrupp?", "bg": "#A758A5", "textColor": "#FFFFFF"}, {"text": "Hur tar jag ansvar för mitt eget mående i arbetslivet?", "bg": "#EF7765", "textColor": "#211b83"}, {"text": "Hur ser jag till att mina behov av återhämtning blir uppfyllda?", "bg": "#EF7765", "textColor": "#211b83"}, {"text": "Hur visar jag både mig själv och andra att jag sätter gränser med respekt?", "bg": "#FFD3CF", "textColor": "#211b83"}, {"text": "Hur uttrycker jag mina åsikter samtidigt som jag visar hänsyn?", "bg": "#A758A5", "textColor": "#FFFFFF"}, {"text": "Hur visar jag respekt i mina relationer på jobbet – och hur märks det?", "bg": "#345E58", "textColor": "#FFFFFF"}, {"text": "Vilka begränsande föreställningar har jag om mig själv – och hur kan jag utmana dem?", "bg": "#D85F4E", "textColor": "#FFFFFF"}, {"text": "Hur stöttar jag kollegor när de går igenom något utmanande?", "bg": "#FFD3CF", "textColor": "#211b83"}, {"text": "Hur skulle jag beskriva kulturen på min arbetsplats i ord?", "bg": "#345E58", "textColor": "#FFFFFF"}, {"text": "När fungerar samarbetet som bäst – och hur kan vi skapa fler sådana tillfällen?", "bg": "#D5A249", "textColor": "#211b83"}, {"text": "Vad innebär tydlig kommunikation för mig – och hur tränar jag på det?", "bg": "#EF7765", "textColor": "#211b83"}, {"text": "Vilka hjälpmedel eller rutiner har vi för att stärka vår kommunikation?", "bg": "#345E58", "textColor": "#FFFFFF"}, {"text": "Hur tror jag att andra uppfattar mig i vår grupp?", "bg": "#345E58", "textColor": "#FFFFFF"}, {"text": "Hur vill jag bli uppfattad i mitt professionella sammanhang?", "bg": "#DCECEF", "textColor": "#211b83"}, {"text": "Vad är jag mest stolt över i mitt yrkesliv hittills?", "bg": "#EF7765", "textColor": "#211b83"}, {"text": "Vad behöver jag för att känna mig trygg i ett arbetslag?", "bg": "#C985C3", "textColor": "#211b83"}, {"text": "Hur vill jag att andra bemöter mig när de har synpunkter på mitt arbete?", "bg": "#50A597", "textColor": "#211b83"}, {"text": "Hur bidrar jag till att skapa trygghet i mitt team?", "bg": "#976F2B", "textColor": "#FFFFFF"}, {"text": "Hur visar jag att jag vill bidra till samarbete och god kultur?", "bg": "#DCECEF", "textColor": "#211b83"}, {"text": "Vad uppskattar jag mest i mitt team just nu?", "bg": "#EF7765", "textColor": "#211b83"}, {"text": "Vad vill jag bidra med i teamet – idag?", "bg": "#C985C3", "textColor": "#211b83"}, {"text": "Vad är viktigast just nu för att skapa ett hållbart och gott arbetsklimat?", "bg": "#DCECEF", "textColor": "#211b83"}, {"text": "Hur visar jag att jag strävar efter att vara mitt bästa jag på jobbet?", "bg": "#EF7765", "textColor": "#211b83"}, {"text": "Hur tar jag ansvar för att följa gemensamma beslut – även när det är svårt?", "bg": "#976F2B", "textColor": "#FFFFFF"}, {"text": "Vad innebär professionalism för mig i relation till andra?", "bg": "#345E58", "textColor": "#FFFFFF"}, {"text": "bg": "#FFD3CF", "textColor": "#211b83"}, {"text": "Vad är jag mest stolt över i mitt bemötande av dem jag möter i mitt arbete?", "bg": "#50A597", "textColor": "#211b83"}, {"text": "När prövas mitt tålamod extra mycket i relation till dem jag möter i min yrkesroll – och hur hanterar jag det?", "bg": "#EF7765", "textColor": "#211b83"}, {"text": "Hur tar jag ansvar i svåra eller utmanande situationer i mötet med dem jag möter i mitt arbete?", "bg": "#D85F4E", "textColor": "#FFFFFF"}, {"text": "Vad gör jag för att utveckla min relationella kompetens i mötet med människor utanför min egen organisation?", "bg": "#976F2B", "textColor": "#FFFFFF"}, {"text": "När någon jag möter visar frustration – hur anpassar jag mitt bemötande för att underlätta kommunikation och förståelse?", "bg": "#A758A5", "textColor": "#FFFFFF"}, {"text": "Vad gör jag för att skapa trygghet för dem jag möter i min yrkesroll?", "bg": "#345E58", "textColor": "#FFFFFF"}, {"text": "Hur bidrar jag till att det jag gör skapar både engagemang och utveckling för dem jag möter i mitt arbete?", "bg": "#FFEDCF", "textColor": "#211b83"}, {"text": "Hur visar jag att andras idéer och tankar är värdefulla i mötet med dem jag är till för?", "bg": "#EAD5EA", "textColor": "#211b83"}, {"text": "Hur möter jag individers olika behov och intressen i mitt dagliga arbete?", "bg": "#EAD5EA", "textColor": "#211b83"}];

    function nextCard() {
      const randomIndex = Math.floor(Math.random() * cards.length);
      const selected = cards[randomIndex];
      document.getElementById("question").innerText = selected.text;
      document.body.style.backgroundColor = selected.bg;
      document.body.style.color = selected.textColor;
    }
  </script>
